// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
}

plugins {
    id("com.android.application") version "8.12.0" apply false
    id("org.jetbrains.kotlin.android") version "2.1.20" apply false
    id("org.jetbrains.kotlin.plugin.compose") version "2.1.20" apply false
    id("com.facebook.react.rootproject")
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://www.jitpack.io" }
        
        // Yuno SDK Repository
        maven {
            url = uri("https://yunopayments.jfrog.io/artifactory/snapshots-libs-release")
        }
    }
}

// Apply Compose plugin to Yuno SDK module
subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        if (subproject.name.contains('yuno-sdk') || subproject.name.contains('yuno-payments')) {
            subproject.apply plugin: 'org.jetbrains.kotlin.plugin.compose'
        }
    }
}
